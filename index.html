<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Paws & Preferences</title>

<link rel="icon"
href="https://cdn-icons-png.flaticon.com/512/616/616430.png">

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>

/* ===== GLOBAL ===== */

html, body {
  width:100%;
  height:100%;
  margin:0;
  padding:0;

  overscroll-behavior:none;
  touch-action:none;
}

body {
  font-family: system-ui, Arial, sans-serif;
  background: linear-gradient(135deg,#f9fafb,#e5ecf4);
  transition:.3s;
}

body.dark {
  background: linear-gradient(135deg,#1f2933,#111827);
}

/* ===== APP ===== */

.app {
  width:100%;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  background:white;
}

body.dark .app {
  background:#1f2933;
  color:#f3f4f6;
}

/* ===== HEADER ===== */

.header {
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  align-items:center;
  gap:8px;

  padding:12px 14px 6px;

  background:inherit;
}

.logo { font-size:22px; }

.header h1 {
  margin:0;
  font-size:18px;
  text-align:center;
}

/* Buttons */

.help-btn,
.theme-btn {
  width:32px;
  height:32px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  color:white;
}

.help-btn { background:#3498db; }
.theme-btn { background:#6b7280; }

/* ===== PROGRESS ===== */

.progress-wrap {
  height:6px;
  background:#e5e7eb;
  margin:0 14px;
  border-radius:4px;
  overflow:hidden;
}

body.dark .progress-wrap {
  background:#374151;
}

.progress-fill {
  height:100%;
  background:linear-gradient(90deg,#34d399,#16a34a);
}

.info {
  text-align:center;
  font-size:12px;
  margin:4px 0 2px;
}

.liked {
  text-align:center;
  color:#16a34a;
  font-weight:bold;
  font-size:12px;
}

/* ===== STACK ===== */

.stack {
  flex:1;

  position:relative;

  margin:6px 0;

  min-height:300px;
}

/* ===== CARD ===== */

.card {
  position:absolute;
  top:0;
  left:4%;
  width:92%;
  height:100%;

  border-radius:20px;
  overflow:hidden;

  background:white;

  cursor:grab;

  transition:.25s;
}

body.dark .card {
  background:#111827;
}

.card.dragging {
  transition:none;
  cursor:grabbing;
}

.card img {
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;

  -webkit-user-drag:none;
}

/* Depth */

.stack .card:nth-last-child(2){
  transform:scale(.97) translateY(8px);
}

.stack .card:nth-last-child(3){
  transform:scale(.94) translateY(16px);
}

/* Fly */

.card.fly-right {
  transform:translateX(120%) rotate(20deg)!important;
  opacity:0;
}

.card.fly-left {
  transform:translateX(-120%) rotate(-20deg)!important;
  opacity:0;
}

/* ===== EMOJI ===== */

.label {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:52px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

/* ===== ACTION BAR ===== */

.action-bar {
  display:flex;
  justify-content:center;
  gap:22px;

  padding:8px 0 14px;
}

/* Tinder Style Buttons */

.action-btn {
  width:66px;
  height:66px;
  border-radius:50%;
  border:none;
  font-size:26px;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  background:white;
  box-shadow:0 6px 14px rgba(0,0,0,.2);

  transition:.15s;
}

.action-btn:active {
  transform:scale(.9);
}

.btn-like {
  background:linear-gradient(135deg,#34d399,#16a34a);
  color:white;
}

.btn-dislike {
  background:linear-gradient(135deg,#fb7185,#e11d48);
  color:white;
}

.btn-undo {
  background:linear-gradient(135deg,#d1d5db,#9ca3af);
}

/* ===== SUMMARY ===== */

.summary {
  padding:20px;
  text-align:center;
}

.summary-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:14px 0;
}

@media(max-width:480px){
  .summary-grid{grid-template-columns:1fr}
}

.summary-grid img {
  width:100%;
  border-radius:12px;
}

.primary-btn {
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#16a34a;
  color:white;
}

/* ===== HELP ===== */

.help-overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.help-modal {
  background:white;
  padding:18px;
  border-radius:14px;
  width:85%;
  max-width:300px;
  text-align:center;
}

body.dark .help-modal {
  background:#111827;
  color:white;
}

.help-close {
  margin-top:10px;
  padding:8px 12px;
  background:#3498db;
  border:none;
  color:white;
  border-radius:8px;
}

/* ===== FOOTER ===== */

.footer-credit {
  position:fixed;
  bottom:8px;
  left:10px;
  font-size:11px;
  color:#6b7280;
}

body.dark .footer-credit {
  color:#9ca3af;
}

</style>
</head>

<body>

<div id="root"></div>
<div class="footer-credit">by Lia</div>

<script type="text/babel">

function App(){

  const TOTAL = 10;

  const [cats,setCats]=React.useState([]);
  const [liked,setLiked]=React.useState([]);
  const [history,setHistory]=React.useState([]);

  const [drag,setDrag]=React.useState({x:0,active:false});
  const [loading,setLoading]=React.useState(true);

  const [showHelp,setShowHelp]=React.useState(false);
  const [flash,setFlash]=React.useState(null);
  const [dark,setDark]=React.useState(false);

  const startRef=React.useRef(0);

  const topCat=cats[cats.length-1];

  /* Lock */

  React.useEffect(()=>{

    document.body.className=dark?"dark":"";

    document.body.style.overflow=
      showHelp?"hidden":"";

  },[dark,showHelp]);

  /* Load */

  async function loadCats(){

    const res=await fetch(
      `https://cataas.com/api/cats?limit=${TOTAL}`
    );

    const data=await res.json();

    const ts=Date.now();

    const urls=data
      .map(c=>c._id||c.id)
      .filter(Boolean)
      .map(id=>`https://cataas.com/cat/${id}?t=${ts}`);

    setCats(urls);
    setLoading(false);
  }

  React.useEffect(()=>{loadCats()},[]);

  /* Keyboard */

  React.useEffect(()=>{

    function key(e){

      if(!topCat) return;

      if(e.key==="ArrowRight") like();
      if(e.key==="ArrowLeft") dislike();
      if(e.key==="z") undo();
      if(e.key==="d") setDark(d=>!d);
      if(e.key==="Escape") setShowHelp(false);
    }

    window.addEventListener("keydown",key);
    return()=>window.removeEventListener("keydown",key);

  },[topCat]);

  /* Global Drag */

  React.useEffect(()=>{

    function handleMove(e){

      if(e.cancelable) e.preventDefault();

      move(e);
    }

    function handleEnd(){ end(); }

    window.addEventListener("mousemove",handleMove);
    window.addEventListener("mouseup",handleEnd);

    window.addEventListener("touchmove",handleMove,{passive:false});
    window.addEventListener("touchend",handleEnd);

    return()=>{

      window.removeEventListener("mousemove",handleMove);
      window.removeEventListener("mouseup",handleEnd);

      window.removeEventListener("touchmove",handleMove);
      window.removeEventListener("touchend",handleEnd);
    };

  },[drag]);

  /* Emoji */

  function flashEmoji(dir){

    setFlash(dir);
    setTimeout(()=>setFlash(null),180);
  }

  function like(){
    flashEmoji("right");
    swipe("right");
  }

  function dislike(){
    flashEmoji("left");
    swipe("left");
  }

  /* Swipe */

  function swipe(dir){

    if(!topCat) return;

    setHistory(h=>[...h,{cats,liked}]);

    setCats(c=>c.slice(0,-1));

    if(dir==="right"){
      setLiked(l=>[...l,topCat]);
    }

    setDrag({x:0,active:false});
  }

  /* Undo */

  function undo(){

    if(!history.length) return;

    const last=history[history.length-1];

    setCats(last.cats);
    setLiked(last.liked);

    setHistory(h=>h.slice(0,-1));
  }

  /* Replay */

  function replay(){

    setCats([]);
    setLiked([]);
    setHistory([]);
    setDrag({x:0,active:false});
    setFlash(null);

    setLoading(true);

    setTimeout(()=>loadCats(),100);
  }

  /* Drag */

  function start(e){

    const x=
      e.touches?e.touches[0].clientX:e.clientX;

    startRef.current=x;

    setDrag({x:0,active:true});
  }

  function move(e){

    if(!drag.active) return;

    const x=
      e.touches?e.touches[0].clientX:e.clientX;

    setDrag({
      x:x-startRef.current,
      active:true
    });
  }

  function end(){

    if(!drag.active) return;

    if(drag.x>80) like();
    else if(drag.x<-80) dislike();

    setDrag({x:0,active:false});
  }

  const progress=TOTAL-cats.length+1;

  return(
    <div className="app">

      {/* Header */}
      <div className="header">

        <span className="logo">😺</span>
        <h1>Paws & Preferences</h1>

        <button
          className="theme-btn"
          onClick={()=>setDark(d=>!d)}
        >
          {dark?"☀️":"🌙"}
        </button>

        <button
          className="help-btn"
          onClick={()=>setShowHelp(true)}
        >?</button>

      </div>

      {!loading&&cats.length>0&&(
      <>
        <div className="progress-wrap">
          <div
            className="progress-fill"
            style={{
              width:`${((TOTAL-cats.length)/TOTAL)*100}%`
            }}
          />
        </div>

        <div className="info">
          {progress}/{TOTAL}
        </div>

        <div className="liked">
          ❤️ {liked.length}
        </div>
      </>
      )}

      {!loading&&cats.length>0&&(
      <div className="stack">

        {cats.map((cat,i)=>{

          const top=i===cats.length-1;

          let style={};

          if(top){
            style={
              transform:
              `translateX(${drag.x}px)
               rotate(${drag.x/12}deg)`
            };
          }

          return(
            <div
              key={cat}
              className={`card
                ${top&&drag.active?"dragging":""}
                ${top&&flash==="right"?"fly-right":""}
                ${top&&flash==="left"?"fly-left":""}
              `}
              style={{zIndex:i,...style}}

              onMouseDown={top?start:null}
              onTouchStart={top?start:null}
            >

              <img src={cat} alt="Cat"/>

              <div
                className="label"
                style={{
                  opacity:
                    drag.x>50||flash==="right"?1:0
                }}
              >❤️</div>

              <div
                className="label"
                style={{
                  opacity:
                    drag.x<-50||flash==="left"?1:0
                }}
              >❌</div>

            </div>
          );
        })}

      </div>
      )}

      {!loading&&cats.length>0&&(
      <div className="action-bar">

        <button
          className="action-btn btn-dislike"
          onClick={dislike}
        >❌</button>

        <button
          className="action-btn btn-undo"
          onClick={undo}
        >↩️</button>

        <button
          className="action-btn btn-like"
          onClick={like}
        >❤️</button>

      </div>
      )}

      {!loading&&cats.length===0&&(
      <div className="summary">

        <h2>You liked {liked.length} cats 😺</h2>

        <div className="summary-grid">
          {liked.map(src=>(
            <img key={src} src={src}/>
          ))}
        </div>

        <button
          className="primary-btn"
          onClick={replay}
        >
          🔄 Replay
        </button>

      </div>
      )}

      {/* Help */}
      {showHelp&&(
        <div
          className="help-overlay"
          onClick={()=>setShowHelp(false)}
        >
          <div
            className="help-modal"
            onClick={e=>e.stopPropagation()}
          >

            <h3>How to Use</h3>

            <p>👉 Swipe Right = Like ❤️</p>
            <p>👈 Swipe Left = Dislike ❌</p>
            <p>⌨️ Arrow Keys</p>
            <p>🌙 D = Dark Mode</p>
            <p>↩️ Z = Undo</p>

            <button
              className="help-close"
              onClick={()=>setShowHelp(false)}
            >
              Got it
            </button>

          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM
.createRoot(document.getElementById("root"))
.render(<App/>);

</script>
</body>
</html>
