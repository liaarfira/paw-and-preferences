<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Paws & Preferences</title>

<link rel="icon"
href="https://cdn-icons-png.flaticon.com/512/616/616430.png">

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Viewport Height Fix -->
<script>
function fixVH(){
  document.documentElement.style.setProperty(
    "--vh",
    window.innerHeight * 0.01 + "px"
  );
}
fixVH();
window.addEventListener("resize", fixVH);
</script>

<style>

/* ================= RESET ================= */

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

/* ================= BODY ================= */

body{
  font-family:system-ui,Arial,sans-serif;
  background:linear-gradient(135deg,#f9fafb,#e5ecf4);
  min-height:100dvh;
  overflow-y:auto;
  transition:.3s;
}

body.dark{
  background:linear-gradient(135deg,#1f2933,#111827);
}

/* ================= WRAPPER ================= */

.app-wrapper{
  min-height:100dvh;
  min-height:calc(var(--vh,1vh)*100);
  width:100%;

  display:flex;
  justify-content:center;
}

/* ================= APP ================= */

/* Mobile = FULL SCREEN */
.app{
  width:100vw;
  min-height:100dvh;
  min-height:calc(var(--vh,1vh)*100);

  background:white;

  display:flex;
  flex-direction:column;

  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

body.dark .app{
  background:#1f2933;
  color:#f3f4f6;
}

/* Desktop Preview */
@media(min-width:768px){

  .app-wrapper{
    align-items:center;
    padding:16px;
  }

  .app{
    width:100%;
    max-width:420px;
    min-height:90vh;

    border-radius:22px;
    overflow:hidden;

    box-shadow:0 12px 40px rgba(0,0,0,.15);
  }
}

/* ================= HEADER ================= */

.header{
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  align-items:center;
  gap:8px;
  padding:12px;
}

.logo{font-size:22px}

.header h1{
  margin:0;
  font-size:18px;
  text-align:center;
}

.help-btn,
.theme-btn{
  width:32px;
  height:32px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  color:white;
}

.help-btn{background:#3498db}
.theme-btn{background:#6b7280}

/* ================= PROGRESS ================= */

.progress-wrap{
  height:6px;
  background:#e5e7eb;
  margin:0 14px;
  border-radius:4px;
  overflow:hidden;
}

body.dark .progress-wrap{
  background:#374151;
}

.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#34d399,#16a34a);
}

.info,.liked{
  text-align:center;
  font-size:12px;
  margin:2px 0;
}

.liked{
  color:#16a34a;
  font-weight:bold;
}

/* ================= STACK ================= */

.stack{
  flex:1;
  position:relative;
  margin:6px 0;
  touch-action:none;
}

/* ================= CARD ================= */

.card{
  position:absolute;
  top:0;
  left:4%;
  width:92%;
  height:100%;

  border-radius:20px;
  overflow:hidden;

  background:#eee;

  cursor:grab;
  transition:.25s;
}

body.dark .card{
  background:#111827;
}

.card.dragging{
  transition:none;
  cursor:grabbing;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

/* Depth */

.stack .card:nth-last-child(2){
  transform:scale(.97) translateY(8px);
}

.stack .card:nth-last-child(3){
  transform:scale(.94) translateY(16px);
}

/* ================= EMOJI ================= */

.label{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:52px;
  opacity:0;
  transition:.2s;
}

/* ================= BUTTONS ================= */

.action-bar{
  display:flex;
  justify-content:center;
  gap:26px;
  padding:14px 0 20px;
}

.action-btn{
  width:64px;
  height:64px;
  border-radius:50%;

  border:2px solid #e5e7eb;
  background:white;

  font-size:26px;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 6px 14px rgba(0,0,0,.15);

  transition:.12s;
}

.action-btn:active{
  transform:scale(.88);
  box-shadow:0 3px 6px rgba(0,0,0,.15);
}

.btn-like{
  color:#16a34a;
  border-color:#34d399;
  box-shadow:
    0 0 0 4px rgba(52,211,153,.15),
    0 6px 14px rgba(0,0,0,.15);
}

.btn-dislike{
  color:#e11d48;
  border-color:#fb7185;
  box-shadow:
    0 0 0 4px rgba(251,113,133,.15),
    0 6px 14px rgba(0,0,0,.15);
}

.btn-undo{
  color:#6b7280;
  border-color:#d1d5db;
}

/* ================= SUMMARY ================= */

.summary{
  flex:1;
  padding:20px;
  text-align:center;

  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:14px 0;
}

.summary-grid img{
  width:100%;
  border-radius:12px;
}

.primary-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#16a34a;
  color:white;
}

/* ================= HELP ================= */

.help-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.help-modal{
  background:white;
  padding:18px;
  border-radius:14px;
  width:85%;
  max-width:300px;
  text-align:center;
}

body.dark .help-modal{
  background:#111827;
  color:white;
}

.help-close{
  margin-top:10px;
  padding:8px 12px;
  background:#3498db;
  border:none;
  color:white;
  border-radius:8px;
}

/* ================= FOOTER ================= */

.footer-credit{
  position:fixed;
  bottom:8px;
  left:10px;
  font-size:11px;
  color:#6b7280;
}

body.dark .footer-credit{
  color:#9ca3af;
}

</style>
</head>

<body>

<div class="app-wrapper">
  <div id="root"></div>
</div>

<div class="footer-credit">by Lia</div>

<script type="text/babel">

function App(){

  const TOTAL = 10;

  const [cats,setCats]=React.useState([]);
  const [liked,setLiked]=React.useState([]);
  const [history,setHistory]=React.useState([]);

  const [drag,setDrag]=React.useState({x:0,active:false});
  const [loading,setLoading]=React.useState(true);

  const [showHelp,setShowHelp]=React.useState(false);
  const [flash,setFlash]=React.useState(null);
  const [dark,setDark]=React.useState(false);

  const startRef=React.useRef(0);

  const topCat=cats[cats.length-1];

  /* Dark */

  React.useEffect(()=>{
    document.body.classList.toggle("dark",dark);
  },[dark]);

  /* Load */

  async function loadCats(){

    const res=await fetch(
      `https://cataas.com/api/cats?limit=${TOTAL}`
    );

    const data=await res.json();

    const ts=Date.now();

    const urls=data
      .map(c=>c._id||c.id)
      .filter(Boolean)
      .map(id=>`https://cataas.com/cat/${id}?t=${ts}`);

    setCats(urls);
    setLoading(false);
  }

  React.useEffect(()=>{loadCats()},[]);

  /* Keyboard */

  React.useEffect(()=>{

    function key(e){

      if(!topCat) return;

      if(e.key==="ArrowRight") like();
      if(e.key==="ArrowLeft") dislike();
      if(e.key==="z") undo();
      if(e.key==="d") setDark(d=>!d);
      if(e.key==="Escape") setShowHelp(false);
    }

    window.addEventListener("keydown",key);
    return()=>window.removeEventListener("keydown",key);

  },[topCat]);

  /* Emoji */

  function flashEmoji(dir){
    setFlash(dir);
    setTimeout(()=>setFlash(null),180);
  }

  function like(){
    flashEmoji("right");
    swipe("right");
  }

  function dislike(){
    flashEmoji("left");
    swipe("left");
  }

  /* Swipe */

  function swipe(dir){

    if(!topCat) return;

    setHistory(h=>[...h,{cats,liked}]);

    setCats(c=>c.slice(0,-1));

    if(dir==="right"){
      setLiked(l=>[...l,topCat]);
    }

    setDrag({x:0,active:false});
  }

  /* Undo */

  function undo(){

    if(!history.length) return;

    const last=history[history.length-1];

    setCats(last.cats);
    setLiked(last.liked);

    setHistory(h=>h.slice(0,-1));
  }

  /* Replay */

  function replay(){

    setCats([]);
    setLiked([]);
    setHistory([]);

    setLoading(true);

    setTimeout(()=>loadCats(),100);
  }

  /* Drag */

  function start(e){

    const x=
      e.touches?e.touches[0].clientX:e.clientX;

    startRef.current=x;

    setDrag({x:0,active:true});
  }

  function move(e){

    if(!drag.active) return;

    const x=
      e.touches?e.touches[0].clientX:e.clientX;

    setDrag({
      x:x-startRef.current,
      active:true
    });
  }

  function end(){

    if(!drag.active) return;

    if(drag.x>80) like();
    else if(drag.x<-80) dislike();

    setDrag({x:0,active:false});
  }

  const progress=TOTAL-cats.length+1;

  return(
    <div className="app">

      <div className="header">

        <span className="logo">😺</span>
        <h1>Paws & Preferences</h1>

        <button
          className="theme-btn"
          onClick={()=>setDark(d=>!d)}
        >
          {dark?"☀️":"🌙"}
        </button>

        <button
          className="help-btn"
          onClick={()=>setShowHelp(true)}
        >?</button>

      </div>

      {!loading&&cats.length>0&&(
      <>
        <div className="progress-wrap">
          <div
            className="progress-fill"
            style={{
              width:`${((TOTAL-cats.length)/TOTAL)*100}%`
            }}
          />
        </div>

        <div className="info">{progress}/{TOTAL}</div>
        <div className="liked">❤️ {liked.length}</div>
      </>
      )}

      {!loading&&cats.length>0&&(
      <div className="stack">

        {cats.map((cat,i)=>{

          const top=i===cats.length-1;

          let style={};

          if(top){
            style={
              transform:
              `translateX(${drag.x}px)
               rotate(${drag.x/12}deg)`
            };
          }

          return(
            <div
              key={cat}
              className={`card ${top&&drag.active?"dragging":""}`}
              style={{zIndex:i,...style}}

              onMouseDown={top?start:null}
              onMouseMove={top?move:null}
              onMouseUp={top?end:null}
              onMouseLeave={top?end:null}

              onTouchStart={top?start:null}
              onTouchMove={top?move:null}
              onTouchEnd={top?end:null}
            >

              <img src={cat} alt="Cat"/>

              <div
                className="label"
                style={{
                  opacity:
                    drag.x>50||flash==="right"?1:0
                }}
              >❤️</div>

              <div
                className="label"
                style={{
                  opacity:
                    drag.x<-50||flash==="left"?1:0
                }}
              >❌</div>

            </div>
          );
        })}

      </div>
      )}

      {!loading&&cats.length>0&&(
      <div className="action-bar">

        <button
          className="action-btn btn-dislike"
          onClick={dislike}
        >❌</button>

        <button
          className="action-btn btn-undo"
          onClick={undo}
        >↩️</button>

        <button
          className="action-btn btn-like"
          onClick={like}
        >❤️</button>

      </div>
      )}

      {!loading&&cats.length===0&&(
      <div className="summary">

        <h2>You liked {liked.length} cats 😺</h2>

        <div className="summary-grid">
          {liked.map(src=>(
            <img key={src} src={src}/>
          ))}
        </div>

        <button
          className="primary-btn"
          onClick={replay}
        >
          🔄 Replay
        </button>

      </div>
      )}

      {showHelp&&(
        <div
          className="help-overlay"
          onClick={()=>setShowHelp(false)}
        >
          <div
            className="help-modal"
            onClick={e=>e.stopPropagation()}
          >

            <h3>How to Use</h3>

            <p>👉 Swipe Right = Like ❤️</p>
            <p>👈 Swipe Left = Dislike ❌</p>
            <p>⌨️ Arrow Keys</p>
            <p>🌙 D = Dark Mode</p>
            <p>↩️ Z = Undo</p>

            <button
              className="help-close"
              onClick={()=>setShowHelp(false)}
            >
              Got it
            </button>

          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM
.createRoot(document.getElementById("root"))
.render(<App/>);

</script>
</body>
</html>
